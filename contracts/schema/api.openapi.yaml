    "title": "AConsole methods",
    "version": "1.0.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/api/v1/app/health": {
      "post": {
        "operationId": "app_health",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EmptyParams"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResult"
                }
              }
            },
            "description": "method result",
            "headers": {
              "X-Aconsole-Timeout-Ms": {
                "description": "Milliseconds the caller should wait for this method.",
                "schema": {
                  "const": 10000,
                  "type": "integer"
                }
              }
            }
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorObject"
                }
              }
            },
            "description": "invalid params",
            "headers": {
              "X-Aconsole-Timeout-Ms": {
                "description": "Milliseconds the caller should wait for this method.",
                "schema": {
                  "const": 10000,
                  "type": "integer"
                }
              }
            }
          },
          "401": {
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "description": "unauthorized",
            "headers": {
              "X-Aconsole-Timeout-Ms": {
                "description": "Milliseconds the caller should wait for this method.",
                "schema": {
                  "const": 10000,
                  "type": "integer"
                }
              }
            }
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorObject"
                }
              }
            },
            "description": "forbidden",
            "headers": {
